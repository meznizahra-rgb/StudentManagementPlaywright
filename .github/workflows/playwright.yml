
name: Playwright E2E Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Playwright project
        uses: actions/checkout@v6

      - name: Checkout Student application
        uses: actions/checkout@v6
        with:
          repository: https://github.com/walidhnaien/student-management-system
          path: student-app

      - name: Start application
        run: docker compose -f student-app/docker-compose.yml up -d --build --wait

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Wait for Angular
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:4200/ > /dev/null; then
              exit 0
            fi
            sleep 3
          done
          docker compose -f student-app/docker-compose.yml logs
          exit 1

      - name: Run Playwright tests
        run: npx playwright test --project=chromium
        env:
          CI: 'true'

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Docker logs
        if: failure()
        run: docker compose -f student-app/docker-compose.yml logs --tail=100
