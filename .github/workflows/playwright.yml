
name: Playwright E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Playwright
        uses: actions/checkout@v4

      - name: Checkout Student Management System
        uses: actions/checkout@v4
        with:
          repository: walidhnaien/student-management-system
          ref: master
          path: student-app

      - name: Start application with Docker
        working-directory: student-app
        run: docker compose up -d --build --wait

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Playwright dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Wait for Angular
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:4200/ > /dev/null; then
              exit 0
            fi
            sleep 3
          done
          exit 1

      - name: Run Playwright tests
        run: npx playwright test --project=chromium
        env:
          CI: 'true'

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

      - name: Show Docker logs on failure
        if: failure()
        working-directory: student-app
        run: docker compose logs --tail=100
